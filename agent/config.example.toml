# PrintMaster Agent Configuration Example
# Copy this file to config.toml and customize for your environment

# Windows service installs protect mTLS identity, enrollment, pending, and
# renewal keys with TPM/CNG when available or service-scoped DPAPI fallback.
# Do not add private-key PEM material to this file.

# Asset ID regex pattern (customize for your asset tag format)
asset_id_regex = "\\b\\d{5}\\b"

# Number of concurrent SNMP queries (adjust based on network capacity)
discovery_concurrency = 50

# Enable Epson remote-mode commands (experimental richer metrics)
epson_remote_mode_enabled = false

[snmp]
  # SNMP protocol version: "1", "2c", or "3"
  # - "1"  : Legacy, no encryption, community-based auth
  # - "2c" : Legacy compatibility, no encryption, community-based auth
  # - "3"  : Secure, supports authentication and encryption (recommended for production)
  version = "2c"
  
  # Community string for SNMPv1/v2c (ignored for v3). Set a site-specific
  # value; SNMPv3 with authPriv is preferred for production networks.
  community = "replace-with-site-secret"

  # Community accepted by the optional UDP/162 trap listener. Keep empty to
  # keep trap monitoring disabled; set a separate site-specific secret before
  # enabling traps. The listener never falls back to the well-known "public".
  trap_community = ""
  
  # SNMP timeout in milliseconds
  timeout_ms = 2000
  
  # Number of retries for failed SNMP queries
  retries = 1
  
  # ===== SNMPv3 Security Settings (only used when version = "3") =====
  
  # Security level: "noAuthNoPriv", "authNoPriv", or "authPriv"
  # - "noAuthNoPriv" : No authentication, no encryption (not recommended)
  # - "authNoPriv"   : Authentication only
  # - "authPriv"     : Authentication + encryption (recommended for v3)
  security_level = ""
  
  # SNMPv3 username (USM security name)
  username = ""
  
  # Authentication protocol: "MD5", "SHA", "SHA224", "SHA256", "SHA384", "SHA512"
  auth_protocol = ""
  
  # Authentication password (minimum 8 characters)
  auth_password = ""
  
  # Privacy/encryption protocol: "DES", "AES", "AES192", "AES256"
  priv_protocol = ""
  
  # Privacy password (minimum 8 characters)
  priv_password = ""
  
  # SNMPv3 context name (usually empty unless device requires it)
  context_name = ""

[server]
  # Enable server upload mode (set to true when using with PrintMaster Server)
  enabled = true
  
  # PrintMaster Server URL (use HTTPS for every remote server)
  url = "https://localhost:9443"
  
  # Unique agent identifier (auto-generated if blank)
  agent_name = "Debug Test Agent"
  
  # Path to server CA certificate (optional, for self-signed certs)
  ca_path = ""
  
  # How often to upload discovery data to server (seconds)
  upload_interval_seconds = 300
  
  # How often to send heartbeat to server (seconds)
  heartbeat_interval_seconds = 60
  
  # Authentication token (if server requires it)
  token = ""

[auto_update]
  # inherit  -> follow fleet policy when connected (default)
  # local    -> always use the local_policy block below
  # disabled -> never auto-update unless triggered manually
  mode = "inherit"
  
  # Update channel: "stable", "dev", or "" (auto-detect from build type)
  # - "stable" : Only receive stable release updates
  # - "dev"    : Receive development builds (main branch builds)
  # - ""       : Auto-detect based on build type (dev builds -> dev channel)
  channel = ""

  [auto_update.local_policy]
    # Number of days between update checks when falling back to local policy
    update_check_days = 7
    version_pin_strategy = "minor"
    allow_major_upgrade = false
    target_version = ""
    collect_telemetry = true

    [auto_update.local_policy.maintenance_window]
      enabled = false
      timezone = ""
      start_hour = 0
      start_min = 0
      end_hour = 0
      end_min = 0
      days_of_week = []

    [auto_update.local_policy.rollout_control]
      staggered = true
      max_concurrent = 0
      batch_size = 0
      delay_between_waves = 0
      jitter_seconds = 0
      emergency_abort = false

[database]
  # SQLite database path (blank = use default location)
  path = ''

[logging]
  # Log level: debug, info, warn, error
  level = "info"

[web]
  # Keep the agent UI on loopback. Remote management uses its authenticated server connection.
  bind_address = '127.0.0.1'
  # HTTP port for web UI
  http_port = 8080
  
  # HTTPS port (if TLS enabled)
  https_port = 8443
  
  # Enable TLS/HTTPS
  enable_tls = false
