name: Hardening checks
on:
  pull_request:
  push:
    branches: [hardening/local-and-security]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: ./dev.ps1 deps
      - name: Go and JavaScript tests
        shell: pwsh
        run: ./dev.ps1 test -Profile sqlite
      - name: Known vulnerability scan
        shell: pwsh
        run: ./dev.ps1 audit -Profile sqlite
      - name: Build native applications
        shell: pwsh
        run: ./dev.ps1 build -Profile sqlite
  linux-race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: [common, agent, server]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Race detection
        working-directory: '${{ matrix.module }}'
        run: go test -race ./... -timeout 180s
  postgres-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: server/go.sum
      - name: Require Docker for PostgreSQL integration
        run: docker info
      - name: Atomic enrollment on PostgreSQL
        working-directory: server
        run: go test -tags integration ./storage -run '^TestPostgresEnrollmentAtomicity$' -count=1 -timeout 180s
